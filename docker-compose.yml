# One-command Neo4j for local dev. Boot with:
#   docker compose up -d
#
# Then point .env at it:
#   NEO4J_URI=bolt://localhost:7687
#   NEO4J_USER=neo4j
#   NEO4J_PASSWORD=agridiffuse
#
# Browser console at http://localhost:7474 — log in with the same creds and
# run `MATCH (n) RETURN n LIMIT 25` to see the seeded graph after the first
# request hits /api/graph.

services:
  neo4j:
    image: neo4j:5.21-community
    container_name: agridiffuse-neo4j
    ports:
      - "7474:7474" # HTTP / browser
      - "7687:7687" # Bolt / driver
    environment:
      - NEO4J_AUTH=neo4j/agridiffuse
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p agridiffuse 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
